name: نسخة الحاسبة (Windows EXE)

# كل ما يتحدث التطبيق، ينبني EXE جديد وينزل بـ Releases.
# البرنامج بأجهزة الناس يشوفه ويطلعلهم «حدّث هسه».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/app/**', 'desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Put the app inside the program
        shell: pwsh
        run: |
          if (Test-Path desktop/app) { Remove-Item desktop/app -Recurse -Force }
          Copy-Item public/app desktop/app -Recurse
          Get-Content desktop/app/version.json

      - name: Program version (goes up by itself every build)
        working-directory: desktop
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build EXE and publish it to Releases
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

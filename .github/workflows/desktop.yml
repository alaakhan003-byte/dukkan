name: نسخة الحاسبة (Windows EXE)

# ينبني EXE جديد بس لما يتغير البرنامج نفسه (مجلد desktop).
# تحديثات التطبيق العادية توصل للبرنامج من الموقع مباشرة وبثواني (حوالي 1 ميگا).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Put the app inside the program
        shell: pwsh
        run: |
          if (Test-Path desktop/app) { Remove-Item desktop/app -Recurse -Force }
          Copy-Item public/app desktop/app -Recurse
          Get-Content desktop/app/version.json

      - name: Program version (goes up by itself every build)
        working-directory: desktop
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version

      - name: Release tag
        run: |
          git tag v1.0.${{ github.run_number }}
          git push origin v1.0.${{ github.run_number }}

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build EXE
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Publish one release with all its files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create v1.0.${{ github.run_number }}
          desktop/dist/Dukkan-Setup.exe desktop/dist/Dukkan-Setup.exe.blockmap desktop/dist/latest.yml
          --repo ${{ github.repository }} --latest
          --title "دكّان للحاسبة 1.0.${{ github.run_number }}"
          --notes "نسخة ويندوز من دكّان. التطبيق كله داخل البرنامج ويشتغل بدون إنترنت، والتحديثات توصل لحالها."

      - name: Remove broken or half-made old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $rs = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          foreach ($r in $rs) {
            $names = @($r.assets | ForEach-Object { $_.name })
            if ($r.draft -or -not ($names -contains 'latest.yml') -or $r.tag_name -like 'desktop-*') {
              Write-Host "removing $($r.tag_name) ($($r.id))"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$($r.id)"
            }
          }

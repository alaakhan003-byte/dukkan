<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>دكّان</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;font:16px/1.7 "Segoe UI",Tahoma,sans-serif;background:linear-gradient(165deg,#3730A3,#1E1B4B);color:#fff;text-align:center}
.c{max-width:420px;padding:24px}img{width:96px;height:96px;border-radius:26px}h1{font-size:24px;margin:14px 0 6px}p{color:#D7DBFF;margin:0 0 20px}
button{font:inherit;font-weight:700;min-height:48px;padding:0 26px;border-radius:14px;border:0;background:#fff;color:#312E81;cursor:pointer}</style></head>
<body><div class="c"><img src="icon.png" alt=""><h1>ما گدرت أفتح دكّان</h1><p>تأكد من الإنترنت أول مرة تفتح التطبيق. بعدها يشتغل حتى بدون إنترنت.</p><button id="r">حاول مرة ثانية</button></div>
<script>document.getElementById('r').onclick=function(){var u=new URLSearchParams(location.search).get('u');if(u)location.href=u;};</script></body></html>
